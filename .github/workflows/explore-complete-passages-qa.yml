name: Complete passages in Explore
on:
  pull_request:
    paths:
      - 'library/**'
      - 'index.html'
      - 'sw.js'
      - 'knowledge/scripture.json'
      - 'knowledge/search.mjs'
      - 'knowledge/kinds.mjs'
      - 'salok-mahalla9/data/**'
      - 'salok-kabir/data/**'
      - 'content-intake/sggs/**'
      - 'tools/sggs-original-research.mjs'
      - 'tools/fetch-sggs-research-witnesses.mjs'
      - 'tools/build-sggs-research-index.mjs'
      - 'tools/build-explore-crosswalk.mjs'
      - 'tools/script-integrity/**'
      - 'tools/build-app-bundles.mjs'
      - 'tools/build-offline.mjs'
      - 'tools/refresh-app-sri.mjs'
      - 'tests/explore-complete-passages*.mjs'
      - '.github/workflows/explore-complete-passages-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the locked build tools and browser
        run: |
          node --test tests/library-script-toolchain-lock.mjs
          npm ci --prefix tools/script-integrity --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Capture the exact full witness and reconstruct the original-only research packet
        run: |
          node tools/fetch-sggs-research-witnesses.mjs --output "$RUNNER_TEMP/glp-sggs-witnesses"
          node tools/build-sggs-research-index.mjs --witness-dir "$RUNNER_TEMP/glp-sggs-witnesses" --output "$RUNNER_TEMP/glp-sggs-index" > "$RUNNER_TEMP/glp-explore-index-receipt.json"
      - name: Reproduce all complete-sequence bindings and exercise refusal paths
        env:
          GLP_SGGS_INDEX: ${{ runner.temp }}/glp-sggs-index/index.json
        run: |
          node tools/build-explore-crosswalk.mjs --index "$GLP_SGGS_INDEX" > "$RUNNER_TEMP/glp-explore-crosswalk-receipt.json"
          node --test --test-reporter=tap tests/explore-complete-passages.mjs tests/library-script-integrity-inputs.mjs > "$RUNNER_TEMP/glp-explore-contracts.tap"
          node tools/build-app-bundles.mjs --check
          node tools/refresh-app-sri.mjs --check
          node tools/refresh-reader-sri.mjs --check
          node tools/build-offline.mjs
          git diff --exit-code -- library index.html sw.js tools/script-integrity
      - name: Exercise search, exact original rendering, existing readers, Back, privacy and offline delivery
        run: node tests/explore-complete-passages-browser.mjs
      - name: Preserve receipts and browser evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explore-complete-passages-results
          path: |
            ${{ runner.temp }}/glp-explore-index-receipt.json
            ${{ runner.temp }}/glp-explore-crosswalk-receipt.json
            ${{ runner.temp }}/glp-explore-contracts.tap
            evidence/explore-complete-passages/
          if-no-files-found: warn
