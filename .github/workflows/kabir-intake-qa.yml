name: GLP Kabir Source Intake
on:
  pull_request:
    paths:
      - 'content-intake/kabir/**'
      - 'tools/*kabir*.mjs'
      - 'tests/kabir-intake.mjs'
      - 'knowledge/scripture.json'
      - 'knowledge/source-lock.mjs'
      - '.github/workflows/kabir-intake-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check tools/validate-kabir-intake.mjs
          node --check tools/fetch-kabir-witnesses.mjs
          node tools/fetch-kabir-witnesses.mjs --output "$RUNNER_TEMP/kabir-witness"
          node tools/validate-kabir-intake.mjs --witness-dir "$RUNNER_TEMP/kabir-witness" --report evidence/kabir-intake/validation.json
          GLP_KABIR_WITNESS_DIR="$RUNNER_TEMP/kabir-witness" node tests/kabir-intake.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kabir-intake-evidence
          path: evidence/kabir-intake/
          retention-days: 90
