name: GLP Knowledge Pilot QA
on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'tests/knowledge-*.mjs'
      - '.github/workflows/knowledge-pilot-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check knowledge/core.mjs
          node --check knowledge/registry.mjs
          node --check knowledge/app.mjs
          node tests/knowledge-contract.mjs
          node tests/knowledge-source-registry.mjs
          node tests/knowledge-editorial-title.mjs
          node tests/knowledge-editorial-boundary.mjs
          git diff --exit-code 83acf3f9e4c69c346f2be16d02f407838a137cf9 -- knowledge/scripture.json knowledge/pilot.json knowledge/source-lock.mjs
          node tests/knowledge-source-witness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-source-registry-evidence
          path: |
            evidence/knowledge-registry/
            evidence/knowledge-editorial-boundary/
          retention-days: 90
  browser:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - run: |
          node tests/knowledge-browser.mjs
          node tests/knowledge-editorial-boundary-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-pilot-viewport-evidence
          path: |
            evidence/knowledge-pilot/
            evidence/knowledge-editorial-boundary/
          retention-days: 90
