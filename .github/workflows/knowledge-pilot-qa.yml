name: GLP Knowledge Pilot QA
on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'tests/knowledge-*.mjs'
      - 'tests/helpers/module-fixture.mjs'
      - 'tests/helpers/public-knowledge-scope.mjs'
      - 'evidence/public-knowledge-access/change-scope.json'
      - 'tools/build-app-bundles.mjs'
      - 'tools/refresh-app-sri.mjs'
      - 'tools/script-integrity/**'
      - 'tests/library-script-integrity*.mjs'
      - 'tests/library-script-toolchain-lock.mjs'
      - 'sw.js'
      - '.github/workflows/knowledge-pilot-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check knowledge/core.mjs
          node --check knowledge/registry.mjs
          node --check knowledge/kinds.mjs
          node --check knowledge/search.mjs
          node --check knowledge/app.mjs
          node --test tests/knowledge-learning.mjs
          node --test tests/knowledge-public-access.mjs tests/library-script-integrity-inputs.mjs
          node tests/knowledge-contract.mjs
          node tests/knowledge-source-registry.mjs
          node tests/knowledge-editorial-title.mjs
          node tests/knowledge-editorial-boundary.mjs
          node tests/knowledge-search.mjs
          node tests/knowledge-integration.mjs
          # Teaching/registry retain PR57 checks through the exact public-access scope above.
          git diff --exit-code f720099b6181919d597e249f9ad42b9f00cabe68 -- knowledge/scripture.json knowledge/source-lock.mjs
          node tests/knowledge-source-witness.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-source-registry-evidence
          path: |
            evidence/knowledge-registry/
            evidence/knowledge-editorial-boundary/
            evidence/knowledge-search/
            evidence/knowledge-integration/
            evidence/library-script-integrity/browser/
          retention-days: 90
  browser:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --test tests/library-script-toolchain-lock.mjs
          npm ci --prefix tools/script-integrity --ignore-scripts --no-audit --no-fund
          node tools/build-app-bundles.mjs --check
          node tools/refresh-app-sri.mjs --check
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - run: |
          node tests/knowledge-journey-browser.mjs
          node tests/knowledge-browser.mjs
          node tests/knowledge-editorial-boundary-browser.mjs
          node tests/knowledge-search-browser.mjs
          node tests/knowledge-integration-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-pilot-viewport-evidence
          path: |
            evidence/knowledge-journey/
            evidence/knowledge-pilot/
            evidence/knowledge-editorial-boundary/
            evidence/knowledge-search/
            evidence/knowledge-integration/
            evidence/library-script-integrity/browser/
          retention-days: 90
