name: Farid selected source-only reader checks
on:
  pull_request:
    paths:
      - 'salok-farid/**'
      - 'research/salok-farid/**'
      - 'nitnem/reader.js'
      - 'tools/build-salok-farid-source.mjs'
      - 'tools/fetch-salok-farid-secondary.py'
      - 'tools/refresh-reader-sri.mjs'
      - 'tests/salok-farid-*.mjs'
      - 'tests/reader-sri.mjs'
      - 'tests/library-script-integrity*.mjs'
      - '.github/workflows/salok-farid-reader-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce the explicit selection from pinned source witnesses
        run: |
          node tools/fetch-farid-witnesses.mjs --output "$RUNNER_TEMP/glp-farid-witnesses"
          node tools/build-salok-farid-source.mjs --witness-dir "$RUNNER_TEMP/glp-farid-witnesses"
          git diff --exit-code -- salok-farid/data/ research/salok-farid/ content-intake/
      - name: Install the locked integrity toolchain
        run: npm ci --prefix tools/script-integrity --ignore-scripts --no-audit --no-fund
      - name: Check complete originals, custody failures, old source preservation and script protection
        run: |
          node --test tests/salok-farid-content.mjs tests/salok-kabir-bindings.mjs tests/reader-sri.mjs tests/library-script-integrity.mjs tests/library-script-integrity-inputs.mjs
          node tests/salok-kabir-content.mjs
          node tests/salok-mahalla9-content.mjs
          node tools/refresh-app-sri.mjs
          node tools/build-offline.mjs
          git diff --exit-code -- sw.js
      - name: Install pinned browser tooling and Gurmukhi fonts
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Exercise source-only Farid and the existing Kabir reader in fresh contexts
        run: |
          node tests/salok-farid-browser.mjs
          node tests/salok-kabir-browser.mjs
      - name: Retain builder evidence, not a release approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: farid-source-only-reader-evidence
          path: |
            evidence/salok-farid/
            evidence/salok-kabir/browser.json
          if-no-files-found: warn
