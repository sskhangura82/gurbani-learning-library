name: GLP Reader Quality Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable Gurbani and learning contracts
        run: node tests/verify.mjs
      - name: Service worker cache and upgrade contracts
        run: node tests/service-worker.mjs
      - name: Multi-tab persistence and merge
        run: node tests/shared-learning.mjs
      - name: Reader code syntax
        run: node --check js/japji-full.js
      - name: Revision 6 preservation and preferences
        run: node tests/r6-contract.mjs
      - name: Revision 7 home, pace and rooms contracts
        run: node tests/r7-contract.mjs
      - name: Sukhmani source, published-content preservation and first-eighteen teaching coverage
        run: node tests/sukhmani-content.mjs
      - name: Sukhmani saved learning, import and preservation
        run: node tests/sukhmani-reader-core.mjs
      - name: Sukhmani code syntax
        run: |
          node --check js/sukhmani-reader.js
          node --check js/sukhmani-learning.js
  verify-sukhmani-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Test reading, local learning and offline preview with synthetic data
        run: node tests/sukhmani-browser.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sukhmani-browser-evidence
          path: |
            evidence/sukhmani-browser-verification.json
            evidence/screenshots/sukhmani/
          if-no-files-found: warn
