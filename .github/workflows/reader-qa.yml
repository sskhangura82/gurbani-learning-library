name: GLP Reader Quality Gate
on:
  pull_request:
    branches: [main, fix/claude-review-first-repairs-20261125, feature/salok-mahalla9-reader-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable Gurbani and learning contracts
        run: node tests/verify.mjs
      - name: Service worker cache and upgrade contracts
        run: node tests/service-worker.mjs
      - name: Multi-tab persistence and merge
        run: node tests/shared-learning.mjs
      - name: Preserve unmatched and long Japji learning
        run: node tests/japji-retained-learning.mjs
      - name: Runtime original scripture integrity and tamper rejection
        run: node --test tests/source-integrity.mjs
      - name: Reader code syntax
        run: node --check js/japji-full.js
      - name: Revision 6 preservation and preferences
        run: node tests/r6-contract.mjs
      - name: Revision 7 home, pace and rooms contracts
        run: node tests/r7-contract.mjs
      - name: Sukhmani source, published-content preservation and complete Sukhmani teaching coverage
        run: node tests/sukhmani-content.mjs
      - name: Sukhmani saved learning, import and preservation
        run: node tests/sukhmani-reader-core.mjs
      - name: Sukhmani code syntax
        run: |
          node --check js/sukhmani-reader.js
          node --check js/sukhmani-learning.js
      - name: Complete Nitnem sources, teaching and preservation
        run: node tests/nitnem-content.mjs
      - name: Nitnem saved learning, edition migration and safe merging
        run: node tests/nitnem-learning.mjs
      - name: Collection-sized backup limits and exact export/import round trips
        run: node tests/nitnem-backup-capacity.mjs
      - name: Nitnem asynchronous reflection and reader lifecycle
        run: node tests/nitnem-ui-lifecycle.mjs
      - name: Nitnem code syntax
        run: |
          node --check nitnem/reader.js
          node --check nitnem/local-learning.js
          node --check nitnem/learning/learning-ui.js
          node --check nitnem/offline.js
  verify-sukhmani-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Test reading, local learning and offline preview with synthetic data
        run: node tests/sukhmani-browser.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sukhmani-browser-evidence
          path: |
            evidence/sukhmani-browser-verification.json
            evidence/screenshots/sukhmani/
          if-no-files-found: warn
  verify-nitnem-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium and Gurmukhi fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Test all Nitnem readers, local learning, layouts and offline access
        run: node tests/nitnem-browser.mjs
      - name: Retain Nitnem browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nitnem-browser-evidence
          path: |
            evidence/nitnem-browser-verification.json
            evidence/screenshots/nitnem/
          if-no-files-found: warn
  verify-review-repairs-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium and Gurmukhi fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Test source integrity before rendering and browser-enforced SRI
        run: node tests/source-integrity-browser.mjs
      - name: Test preserved learning and accessible meaning names
        run: node tests/review-repairs-browser.mjs
      - name: Retain repair browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-repairs-browser-evidence
          path: |
            evidence/source-integrity-browser-verification.json
            evidence/review-repairs-browser-verification.json
            evidence/screenshots/review-repairs/
          if-no-files-found: warn
