name: GLP Reader Quality Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Immutable Gurbani and learning contracts
        run: node tests/verify.mjs
      - name: Service worker cache and upgrade contracts
        run: node tests/service-worker.mjs
      - name: Multi-tab persistence and merge
        run: node tests/shared-learning.mjs
      - name: Reader code syntax
        run: node --check js/japji-full.js
      - name: Revision 6 preservation and preferences
        run: node tests/r6-contract.mjs
      - name: Revision 7 home, pace and rooms contracts
        run: node tests/r7-contract.mjs
      - name: M0 reader preservation and 200 percent learning contracts
        run: node tests/m0-contract.mjs
