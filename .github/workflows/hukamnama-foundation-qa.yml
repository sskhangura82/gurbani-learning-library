name: Daily Hukamnama delivery and private learning
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-and-learning-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the locked application build tools
        run: |
          node --test tests/library-script-toolchain-lock.mjs
          npm ci --prefix tools/script-integrity --ignore-scripts --no-audit --no-fund
      - name: Preserve the historical foundation and verify new refusal paths
        run: |
          node tests/hukamnama-foundation-preserved.mjs
          python3 tests/hukamnama-ingest.py
          node --test tests/hukamnama-json.mjs tests/hukamnama-stage-contract.mjs tests/hukamnama-delivery.mjs tests/hukamnama-learning.mjs tests/hukamnama-import-idempotence.mjs tests/hukamnama-signing.mjs tests/hukamnama-preparation.mjs tests/hukamnama-install-proposal.mjs
      - name: Reproduce the complete pinned application
        run: |
          node tools/build-app-bundles.mjs --check
          node tools/refresh-app-sri.mjs --check
          node --test tests/library-script-integrity-inputs.mjs tests/library-catalog.mjs
          node tools/build-offline.mjs
          git diff --exit-code -- sw.js
      - name: Keep source and builder evidence distinct from review approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hukamnama-source-and-contract-evidence
          path: evidence/daily-hukamnama/
          if-no-files-found: error
  browser-learning-and-offline:
    needs: original-source-and-learning-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing pinned browser test version
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Exercise the signed reading, explanations, notes and offline flow
        run: node tests/hukamnama-browser.mjs
      - name: Preserve browser evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hukamnama-browser-evidence
          path: evidence/daily-hukamnama/ui/
          if-no-files-found: error
# Tests use synthetic private notes in fresh browser contexts. No workflow
# deploys, enables a daily publisher, contacts a custodian or claims device acceptance.
