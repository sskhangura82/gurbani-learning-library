name: GLP Hukamnama Foundation QA
on:
  pull_request:
    paths:
      - "hukamnama/**"
      - "tests/hukamnama-*.mjs"
      - ".github/workflows/hukamnama-foundation-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check hukamnama/core.mjs && node --check hukamnama/reader.mjs && node tests/hukamnama-foundation.mjs
  browser:
    needs: fixture-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - run: node tests/hukamnama-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hukamnama-viewport-evidence
          path: evidence/hukamnama-browser/
          retention-days: 90
